<script>
/*LOGIC*/
const r2=n=>Math.round((+n||0)*100)/100;
function gameTotals(g){
  const per={};
  for(const pid of g.pids)per[pid]={buy:0,cash:0,bit:0,credit:0,n:0};
  for(const e of g.entries){const p=per[e.pid];if(!p||e.void)continue;p.buy=r2(p.buy+e.amount);p[e.method]=r2(p[e.method]+e.amount);p.n++;}
  return per;
}
function chipValue(g,counts){return r2(g.chips.reduce((s,c)=>s+(+(counts&&counts[c.id])||0)*c.value,0));}
function cashoutOf(g,pid){
  const c=g.cashouts&&g.cashouts[pid];
  if(!c)return 0;
  if(c.direct!==''&&c.direct!=null&&!isNaN(+c.direct))return r2(c.direct);
  return chipValue(g,c.counts);
}
/* מזומן משולם במקום, בזמן המשחק. ביט (וחוב ישן) מתחשבנים רק בסוף.
   transfer>0: הבנקאי משלם לשחקן. transfer<0: השחקן משלם לבנקאי. */
function settle(g){
  const per=gameTotals(g);
  const rows=g.pids.map(pid=>{
    const t=per[pid],out=cashoutOf(g,pid);
    return {pid,buy:t.buy,cash:t.cash,bit:t.bit,credit:t.credit,out,net:r2(out-t.buy),transfer:pid===g.banker?0:r2(out-t.bit-t.credit)};
  });
  const pot=r2(rows.reduce((s,x)=>s+x.buy,0));
  const outTotal=r2(rows.reduce((s,x)=>s+x.out,0));
  return {rows,pot,outTotal,diff:r2(outTotal-pot)};
}
/* מה אמור להיות פיזית בקופה ובחשבון הביט. מזומן נכנס בזמן המשחק. ביט נכנס לחשבון רק כשמסמנים שולם בסוף. */
function boxStatus(g){
  let cash=0,bit=0;
  for(const e of g.entries){if(e.void)continue;if(e.method==='cash')cash+=e.amount;}
  const cashBuy=r2(cash);
  let cashEnd=cash,bitEnd=bit;
  for(const r of settle(g).rows){
    if(r.transfer===0)continue;
    const paid=!!(g.paid&&g.paid[r.pid]);
    if(r.transfer<0){
      const a=-r.transfer,m=(g.debtM&&g.debtM[r.pid])||'bit';
      if(m==='cash'){cashEnd+=a;if(paid)cash+=a;}else{bitEnd+=a;if(paid)bit+=a;}
    }else{
      const a=r.transfer,m=(g.payout&&g.payout[r.pid])||'cash';
      if(m==='cash'){cashEnd-=a;if(paid)cash-=a;}else{bitEnd-=a;if(paid)bit-=a;}
    }
  }
  return {cashBuy,cashNow:r2(cash),bitNow:r2(bit),cashEnd:r2(cashEnd),bitEnd:r2(bitEnd)};
}
function statsOf(games){
  const m={};
  for(const g of games.filter(g=>g.status==='done')){
    for(const r of settle(g).rows){
      const a=m[r.pid]||(m[r.pid]={pid:r.pid,games:0,buy:0,out:0,wins:0});
      a.games++;a.buy=r2(a.buy+r.buy);a.out=r2(a.out+r.out);if(r.net>0)a.wins++;
    }
  }
  return Object.values(m).map(a=>({...a,net:r2(a.out-a.buy)})).sort((x,y)=>y.net-x.net);
}
function phoneIntl(p){
  let d=String(p||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='972'+d.slice(1);
  return d;
}
const fmtMoney=n=>{n=r2(n);const a=Math.abs(n);const s=Number.isInteger(a)?String(a):a.toFixed(2);return '₪'+s.replace(/\B(?=(\d{3})+(?!\d))/g,',');};
function billText(g,row,name,bankerName,bankerPhone){
  const owe=-row.transfer;
  let t='היי '+name+', סיכום '+g.name+': ביי-אין '+fmtMoney(row.buy)+', סיום '+fmtMoney(row.out)+'. ';
  t+='נשאר לשלם '+fmtMoney(owe)+' בביט ל'+bankerName+(bankerPhone?' ('+bankerPhone+')':'')+'. תודה!';
  return t;
}
/*END*/

const KEY='kupa-hayya-v1';
const Q=new URLSearchParams(location.search);
const MODE=Q.get('p')?'player':Q.get('i')?'invite':'admin';
const DEF_CHIPS=[
  {id:'c1',name:'לבן',color:'#E8E8EC',value:10},
  {id:'c2',name:'אדום',color:'#D64541',value:20},
  {id:'c3',name:'ירוק',color:'#2E9E62',value:50},
  {id:'c4',name:'שחור',color:'#2A2A31',value:100},
  {id:'c5',name:'כחול',color:'#3B5BDB',value:200}
];
const M_HE={cash:'מזומן',bit:'ביט',credit:'חוב'};
let storageOK=true;
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&Array.isArray(j.games)&&Array.isArray(j.players))return j;}catch(e){storageOK=false;}
  return {players:[],games:[],lastChips:null,lastBuyin:100};
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}if(MODE==='admin')queueSync();}
const ui={view:'home',tab:'games',gameId:null,draft:null,amt:{},fb:null,confirm:null,toast:'',logOpen:false,boxIn:''};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=h=>'<bdi class="num">'+h+'</bdi>';
const money=n=>num(fmtMoney(n));
const signed=n=>num((n>0?'+':n<0?'−':'')+fmtMoney(n));
const cls=n=>n>0?'pos':n<0?'neg':'';
const pname=id=>{const p=S.players.find(p=>p.id===id);return p?p.name:'?';};
const pget=id=>S.players.find(p=>p.id===id)||{};
const G=()=>S.games.find(g=>g.id===ui.gameId);
const dateHe=t=>new Date(t).toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:'2-digit'});
const timeHe=t=>new Date(t).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
function logEv(g,type,text){(g.log=g.log||[]).push({id:uid(),t:Date.now(),type,text});}
function logV(g){
  const L=(g.log||[]).slice().reverse();
  return '<section class="card"><button class="btn" data-a="togglelog">'+(ui.logOpen?'הסתר':'הצג')+' יומן שינויים ('+L.length+')</button>'
   +(ui.logOpen?(L.length?L.map(x=>'<div class="line"><span class="muted small num">'+timeHe(x.t)+'</span><span class="who'+(x.type==='void'?' neg':'')+'">'+esc(x.text)+'</span></div>').join(''):'<span class="muted">אין רשומות.</span>')+'<span class="muted small">היומן רק נוסף. ביי-אין שנמחק מסומן כבוטל ולא נעלם.</span>':'')+'</section>';
}
function boxResult(c){
  if(!c)return '';
  const d=c.diff;
  return '<div class="row"><span class="pill '+(d===0?'good':'bad')+'">'+(d===0?'תואם ✓':'הפרש '+signed(d))+'</span><span class="muted small">בדיקה אחרונה '+timeHe(c.t)+': צפוי '+num(fmtMoney(c.expected))+', בפועל '+num(fmtMoney(c.actual))+'</span></div>';
}
function boxInput(){return '<div class="row"><input type="number" inputmode="decimal" min="0" data-in="box" placeholder="כמה מזומן יש בפועל (₪)" value="'+esc(ui.boxIn)+'" aria-label="מזומן בפועל בקופה"><button class="btn" data-a="boxcheck">בדוק</button></div>';}
function boxLiveV(g){
  const last=(g.boxChecks||[]).slice(-1)[0];
  return '<section class="card"><h2>בדיקת קופה</h2><div class="row"><span class="muted grow">מזומן שצריך להיות בקופה</span><b>'+money(boxStatus(g).cashBuy)+'</b></div>'+boxInput()+boxResult(last)+'</section>';
}
const $app=document.getElementById('app');

function toast(t){
  ui.toast=t;const old=document.querySelector('.toast');if(old)old.remove();
  const d=document.createElement('div');d.className='toast';d.textContent=t;d.setAttribute('role','status');document.body.appendChild(d);
  setTimeout(()=>d.remove(),2200);
}
function go(view,id){ui.view=view;if(id!==undefined)ui.gameId=id;ui.confirm=null;ui.fb=null;ui.boxIn='';render();window.scrollTo(0,0);if(view==='home')loadEvent();}
function ensurePlayer(name){
  name=String(name||'').trim();if(!name)return null;
  let p=S.players.find(p=>p.name===name);
  if(!p){p={id:uid(),name,phone:'',method:'cash'};S.players.push(p);}
  return p;
}

/* column chart: profit rises above the line, loss hangs below it; avatars on top */
function barsV(rows,hgt){
  rows=rows.slice().sort((a,b)=>b.net-a.net);
  const mx=Math.max(1,...rows.map(r=>Math.abs(r.net))),half=hgt/2;
  return '<div class="bars">'+rows.map(r=>{
    const px=r.net===0?0:Math.max(4,Math.round(Math.abs(r.net)/mx*half));
    return '<div class="bc"><div class="bav">'+av({name:r.name,photo:r.photo},32)+'</div><div class="bz" style="height:'+hgt+'px"><div class="bar '+(r.net>=0?'up':'dn')+'" style="height:'+px+'px"></div></div><div class="bv '+cls(r.net)+'">'+signed(r.net)+'</div><div class="bn">'+esc(r.name)+'</div></div>';
  }).join('')+'</div>';
}

/* A synthesized sheep: a sawtooth with a fast tremolo and two vowel-like filters. Longer for bigger amounts. */
let AC=null;
function bleat(t0,len){
  const o=AC.createOscillator(),vib=AC.createOscillator(),vg=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain(),am=AC.createGain(),
        f1=AC.createBiquadFilter(),f2=AC.createBiquadFilter(),out=AC.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(300,t0);o.frequency.linearRampToValueAtTime(390,t0+0.09);o.frequency.exponentialRampToValueAtTime(280,t0+len);
  vib.frequency.value=6;vg.gain.value=8;vib.connect(vg);vg.connect(o.frequency);
  am.gain.value=0.6;lfo.frequency.value=27;lg.gain.value=0.4;lfo.connect(lg);lg.connect(am.gain);
  f1.type='bandpass';f1.frequency.value=900;f1.Q.value=3;f2.type='bandpass';f2.frequency.value=1900;f2.Q.value=4;
  o.connect(am);am.connect(f1);am.connect(f2);f1.connect(out);f2.connect(out);
  out.gain.setValueAtTime(0.0001,t0);out.gain.exponentialRampToValueAtTime(1.1,t0+0.05);out.gain.setValueAtTime(1.1,t0+Math.max(0.06,len-0.14));out.gain.exponentialRampToValueAtTime(0.0001,t0+len);
  out.connect(AC.destination);
  [o,vib,lfo].forEach(x=>{x.start(t0);x.stop(t0+len+0.05);});
}
function baa(amount,ctx){
  try{
    if(S.mute&&!ctx)return;
    const total=Math.min(6,0.6+Math.max(0,+amount||0)/100*0.9);
    if(!ctx){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}
    const c=ctx||AC,prev=AC;AC=c;
    let t=c.currentTime+0.02,left=total;
    while(left>0.05){const len=Math.min(1.1,left);bleat(t,len);t+=len+0.07;left-=len+0.07;}
    if(ctx)AC=prev;
  }catch(e){}
}

  return msgTpl(k).split('{name}').join(p.name||'').split('{date}').join(EV.ev?evDateHe(EV.ev.event_date):'').split('{link}').join(link);
}
function waBtn(k,p){
  const ph=phoneIntl(p.phone);
  if(!ph)return '<span class="muted small">אין טלפון</span>';
  const sent=EV.ev&&S.sent&&S.sent[EV.ev.id+':'+k+':'+p.id];
  return '<a class="btn sm link'+(sent?' on':'')+'" data-a="sent" data-k="'+k+'" data-pid="'+p.id+'" target="_blank" rel="noopener" href="https://wa.me/'+ph+'?text='+encodeURIComponent(msgText(k,p))+'">'+(sent?'נשלחה ✓':'הודעה')+'</a>';
}
function nameRow(r,k){const p=pget(r.player_id);return '<div class="row">'+av(p,28)+'<span class="grow">'+esc(p.name||'?')+'</span>'+(k==='ok'?'<span class="pill good">עלה מהמתנה</span>':'')+(k?waBtn(k,p):'')+'<button class="tag" data-a="rmrsvp" data-pid="'+r.player_id+'" aria-label="הסר">×</button></div>';}
function eventV(){
  if(!sb||!SYNC.session)return '';
  if(!EV.loaded)return '<section class="card"><b>הערב הקרוב</b><span class="muted small">טוען…</span></section>';
  if(!EV.ev)return '<section class="card"><h2>הערב הקרוב</h2><span class="muted small">יוצר דף אישורי הגעה עם קישור לקבוצה.</span><div class="row"><input id="evDate" type="date" value="'+nextThursday()+'" aria-label="תאריך"><input id="evCap" type="number" inputmode="numeric" min="2" value="8" aria-label="מספר מקומות" style="width:80px"></div><button class="btn" data-a="mkevent">צור ערב</button></section>';
  const L=evLists(),cap=EV.ev.capacity,answered=new Set(EV.rows.map(r=>r.player_id)),rest=S.players.filter(p=>!answered.has(p.id));
  let h='<section class="card"><div class="row"><div class="grow"><h2>הערב הקרוב</h2><div class="muted small">'+evDateHe(EV.ev.event_date)+'</div></div><span class="pill '+(L.confirmed.length>=cap?'warn':'good')+'">'+num(L.confirmed.length+'/'+cap)+'</span></div>'+seatsV({event:{capacity:cap},confirmed:L.confirmed,waitlist:L.wait});
  const ed=k=>'<details><summary class="muted small">ערוך את נוסח ההודעה</summary><div class="muted small">אפשר להשתמש ב-{name} {date} {link}</div><textarea class="tpl" data-in="tpl:'+k+'" aria-label="נוסח הודעה">'+esc(msgTpl(k))+'</textarea><button class="btn sm" data-a="tplreset" data-k="'+k+'" style="align-self:flex-start">החזר לנוסח המקורי</button></details>';
  const wl=(S.wl&&S.wl[EV.ev.id])||[],promo=L.confirmed.filter(r=>wl.includes(r.player_id));
  h+='<div class="eyebrow">מגיעים</div>'+(L.confirmed.map(r=>nameRow(r,wl.includes(r.player_id)?'ok':null)).join('')||'<span class="muted small">עדיין אף אחד</span>');
  if(promo.length)h+='<span class="muted small">מי שעלה מהמתנה: כפתור "הודעה" מזמין אותו להגיע.</span>'+ed('ok');
  if(L.wait.length)h+='<div class="eyebrow">רשימת המתנה · "הודעה" מעדכנת שהוא ברשימת המתנה</div>'+L.wait.map(r=>nameRow(r,'wait')).join('')+ed('wait');
  if(L.no.length)h+='<div class="eyebrow">לא מגיעים · "הודעה" אומרת "חבל"</div>'+L.no.map(r=>nameRow(r,'no')).join('')+ed('no');
  if(rest.length)h+='<div class="eyebrow">טרם ענו ('+num(rest.length)+') · "הודעה" שולחת תזכורת</div>'+rest.map(p=>'<div class="row" style="padding:5px 0">'+av(p,28)+'<span class="grow">'+esc(p.name)+'</span>'+waBtn('remind',p)+'</div>').join('')+ed('remind');
  h+='<div class="row"><label class="f grow">מספר מקומות<input id="evCap2" type="number" inputmode="numeric" min="2" value="'+cap+'"></label><button class="btn" data-a="capset" style="align-self:flex-end">עדכן</button></div>';
  if(rest.length)h+='<div class="row"><select id="evAdd" aria-label="הוסף שחקן"><option value="">הוסף שחקן ידנית</option>'+rest.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select><button class="btn" data-a="evadd">הוסף</button></div>';
  const inv=(S.tpl&&S.tpl.invite)||DEF_TPL;
  h+='<label class="f">נוסח ההזמנה ({date} ו-{link} יוחלפו)<textarea class="tpl" data-in="tpl:invite">'+esc(inv)+'</textarea></label>'+(inv.includes('{link}')&&inv.includes('{date}')?'':'<span class="pill warn">חסר {date} או {link} בנוסח</span>')+'<button class="btn sm" data-a="tplreset" data-k="invite" style="align-self:flex-start">החזר לנוסח המקורי</button>';
  h+='<div class="acts"><a class="btn link" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(inviteText())+'">שלח לקבוצה בוואטסאפ</a><button class="btn" data-a="cpinvite">העתק הזמנה</button></div>';
  h+='<button class="btn primary block" data-a="fromevent">פתח משחק מהרשימה</button>';
  h+=ui.confirm==='evcancel'?'<div class="seg2"><button class="btn danger" data-a="evcancelyes">בטל את הערב</button><button class="btn" data-a="cancel">חזרה</button></div>':'<button class="btn danger" data-a="evcancel">בטל ערב</button>';
  return h+'</section>';
}

/* ---------- public pages: personal link (?p=) and invite (?i=) ---------- */
const PUB={loading:true,data:null,err:'',busy:false,me:null,stale:false};
const STAT_HE={confirmed:'מאושר, יש לך מקום',waitlist:'ברשימת המתנה',no:'סימנת שלא מגיע',none:'עוד לא ענית'};
async function pubLoad(){
  const isP=MODE==='player';
  try{
    const r=isP?await sb.rpc('player_view',{p_token:Q.get('p')}):await sb.rpc('invite_view',{p_invite:Q.get('i')});
    if(r.error)throw r.error;
    PUB.data=r.data;PUB.err=r.data?'':'bad';PUB.stale=false;
    if(isP&&r.data){try{localStorage.setItem('pv-cache',JSON.stringify(r.data));}catch(e){}}
  }catch(e){
    PUB.stale=true;
    if(isP&&!PUB.data){try{PUB.data=JSON.parse(localStorage.getItem('pv-cache')||'null');}catch(_){}}
    if(!PUB.data)PUB.err='net';
  }
  PUB.loading=false;renderPub();
}
function pubStart(){
  try{PUB.me=localStorage.getItem('inv-me');}catch(e){}
  if(!sb){PUB.loading=false;PUB.err='net';renderPub();return;}
  renderPub();pubLoad();
  setInterval(()=>{if(!document.hidden&&!PUB.busy)pubLoad();},20000);
}
function renderPub(){$app.innerHTML=MODE==='player'?playerPageV():invitePageV();}
function pubError(){return '<div class="card"><b>'+(PUB.err==='net'?'אין חיבור':'הקישור לא תקין')+'</b><span class="muted">'+(PUB.err==='net'?'בדוק אינטרנט ונסה שוב.':'בקש מהמארח קישור חדש.')+'</span></div>';}
function rosterV(n){
  const li=(a,t)=>a&&a.length?'<div class="eyebrow">'+t+'</div>'+a.map(p=>'<div class="row">'+av(p,28)+'<span>'+esc(p.name)+'</span></div>').join(''):'';
  return '<div class="eyebrow">מגיעים '+num(n.confirmed.length+'/'+n.event.capacity)+'</div>'+(n.confirmed.length?n.confirmed.map(p=>'<div class="row">'+av(p,28)+'<span>'+esc(p.name)+'</span></div>').join(''):'<span class="muted small">עדיין אף אחד</span>')+li(n.waitlist,'רשימת המתנה')+li(n.declined,'לא מגיעים');
}
function seatsV(n){
  const cap=n.event.capacity,f=n.confirmed.length;let p='';
  for(let i=0;i<cap;i++)p+='<i class="pip'+(i<f?' f':'')+'"></i>';
  const w=n.waitlist.length;
  return '<div class="seats" role="img" aria-label="'+f+' מתוך '+cap+' מקומות">'+p+'<span class="small muted">'+(f>=cap?'המקומות מלאים':'נשארו '+num(cap-f)+' מקומות')+(w?' · '+num(w)+' בהמתנה':'')+'</span></div>';
}
function boardV(d){
  const b=d.board;if(!b||!b.overall||!b.overall.length)return '';
  const meId=d.player.id,photo={};b.overall.forEach(x=>{photo[x.id]=x.photo;});
  const mk=rows=>{const mx=Math.max(1,...rows.map(x=>Math.abs(+x.net)));
    return rows.map(x=>{const n=+x.net,w=Math.max(3,Math.round(Math.abs(n)/mx*100));
      return '<div class="rk '+(n>0?'up':n<0?'dn':'')+'">'+av({name:x.name,photo:photo[x.id]},34)+'<span class="grow"><span>'+esc(x.name)+'</span>'+(x.id===meId?'<i class="me">אתה</i>':'')+(x.games?'<div class="muted small">'+num(x.games)+' משחקים</div>':'')+'</span><b class="'+cls(n)+'">'+signed(n)+'</b><span class="rb" style="width:'+w+'%"></span></div>';}).join('');};
  let h='<section class="card"><h2>דירוג כללי</h2><span class="muted small">מהמרוויח הכי גדול למפסיד הכי גדול</span>'+mk(b.overall.slice().reverse())+'</section>';
  if(b.nights&&b.nights.length)h+='<section class="card"><h2>דירוג לפי ערב</h2>'+b.nights.map((n,i)=>'<details'+(i===0?' open':'')+'><summary><b>'+dateHe(n.date)+'</b> <span class="muted small">'+esc(n.name)+'</span></summary>'+mk(n.rows||[])+'</details>').join('')+'</section>';
  return h;
}
function liveCardV(l){
  if(!l)return '';
  const pl=l.players||[],pot=pl.reduce((a,p)=>a+(+p.buy||0),0),mx=Math.max(1,...pl.map(p=>+p.buy||0));
  return '<section class="card live"><div class="row"><span class="dot" aria-hidden="true"></span><h2 class="grow">שידור חי</h2><span class="pill">'+(l.status==='cash'?'ספירת סיום':'המשחק מתנהל')+'</span></div><div class="muted small">'+esc(l.name||'')+(l.banker?' · בנקאי: '+esc(l.banker):'')+'</div><div class="row"><span class="muted">הקופה</span><span class="grow"></span><span class="big">'+money(pot)+'</span></div>'
    +pl.map(p=>'<div class="rk">'+av(p,34)+'<span class="grow"><span>'+esc(p.name)+'</span><div class="muted small">'+num(p.n)+' כניסות</div></span><b>'+money(p.buy)+'</b><span class="rb" style="width:'+Math.max(3,Math.round((+p.buy||0)/mx*100))+'%;background:var(--accent)"></span></div>').join('')+'</section>';
}
function playerPageV(){
  if(PUB.loading)return '<div class="card"><span class="muted">טוען…</span></div>';
  if(!PUB.data)return pubError();
  const d=PUB.data,s=d.summary,net=+s.net;
  let h='<section class="hero"><div class="who">'+av(d.player,64)+'<div><div class="eyebrow">מאזן אישי'+(PUB.stale?' · מידע שמור, אין חיבור':'')+'</div><h1>'+esc(d.player.name)+'</h1></div></div>'
    +'<div><div class="hnet num '+cls(net)+'">'+signed(net)+'</div><div class="hsub">'+(net>0?'אתה ברווח':net<0?'אתה בהפסד':'אתה מאוזן')+(s.games?' אחרי '+num(s.games)+' משחקים':'')+'</div></div>'
    +'<div class="stats"><div class="stat"><b>'+num(s.wins+'/'+s.games)+'</b><span>ניצחונות</span></div><div class="stat"><b class="'+(s.games?cls(net/s.games):'')+'">'+(s.games?signed(r2(net/s.games)):'—')+'</b><span>ממוצע למשחק</span></div><div class="stat"><b>'+num(s.no_show)+'</b><span>לא הגעת אחרי אישור</span></div></div></section>';
  h+=liveCardV(d.live);
  if(d.tonight){
    const es=d.tonight.entries||[],tot=es.reduce((a,e)=>a+(+e.amount||0),0);
    h+='<section class="card"><div class="eyebrow">הערב · '+esc(d.tonight.name)+'</div><div class="row"><span class="grow">סה"כ ביי-אין</span><span class="big">'+money(tot)+'</span></div>'+(es.length?'<div class="tags">'+es.map(e=>'<span class="pill">'+num(fmtMoney(e.amount))+' · '+(M_HE[e.method]||'')+'</span>').join('')+'</div>':'<span class="muted small">עדיין אין ביי-אין רשום</span>')+'</section>';
  }
  if(d.next_event){
    const n=d.next_event,st=n.my_status;
    h+='<section class="card"><div class="eyebrow">הערב הקרוב</div><div class="row"><div class="dbig grow">'+evDateHe(n.event.date)+'</div></div><span><span class="pill '+(st==='confirmed'?'good':st==='waitlist'?'warn':'')+'">'+STAT_HE[st]+'</span></span>'+seatsV(n)+'<div class="seg2"><button class="btn lg'+(st==='confirmed'||st==='waitlist'?' on':'')+'" data-a="prsvp" data-v="yes">מגיע</button><button class="btn lg'+(st==='no'?' on':'')+'" data-a="prsvp" data-v="no">לא מגיע</button></div><details><summary class="muted">מי עוד מגיע</summary>'+rosterV(n)+'</details></section>';
  }
  h+=boardV(d);
  h+='<section class="card"><h2>ההיסטוריה שלי</h2>'+(d.history.length?'<div class="tblw"><table><thead><tr><th>תאריך</th><th class="n">ביי-אין</th><th class="n">סיום</th><th class="n">נטו</th></tr></thead><tbody>'+d.history.map(r=>'<tr><td>'+dateHe(r.date)+'<div class="muted small">'+esc(r.name)+'</div></td><td class="n">'+money(r.buy)+'</td><td class="n">'+money(r.out)+'</td><td class="n '+cls(+r.net)+'"><b>'+signed(+r.net)+'</b></td></tr>').join('')+'</tbody></table></div>':'<span class="muted">עדיין אין משחקים שמורים.</span>')+'</section>';
  return h;
}
function invitePageV(){
  if(PUB.loading)return '<div class="card"><span class="muted">טוען…</span></div>';
  if(!PUB.data)return pubError();
  const d=PUB.data,e=d.event,me=d.roster.find(p=>p.id===PUB.me);
  let h='<section class="hero"><div class="eyebrow">הזמנה · ערב פוקר ביתי</div><div class="dbig" style="font-size:44px">'+evDateHe(e.date)+'</div>'+(e.status==='open'?seatsV(d):'')+'</section>';
  if(e.status!=='open')return h+'<div class="card"><b>הערב הזה כבר סגור</b></div>';
  if(me){
    const st=d.confirmed.some(p=>p.id===me.id)?'confirmed':d.waitlist.some(p=>p.id===me.id)?'waitlist':d.declined.some(p=>p.id===me.id)?'no':'none';
    h+='<section class="card"><div class="row">'+av(me,48)+'<div class="grow"><b style="font:700 19px var(--f-disp)">'+esc(me.name)+'</b><div><span class="pill '+(st==='confirmed'?'good':st==='waitlist'?'warn':'')+'">'+STAT_HE[st]+'</span></div></div><button class="btn sm" data-a="notme">זה לא אני</button></div><div class="seg2"><button class="btn lg'+(st==='confirmed'||st==='waitlist'?' on':'')+'" data-a="irsvp" data-v="yes">מגיע</button><button class="btn lg'+(st==='no'?' on':'')+'" data-a="irsvp" data-v="no">לא מגיע</button></div></section>';
  }else h+='<section class="card"><h2>מי אתה?</h2><div class="pickgrid">'+d.roster.map(p=>'<button class="btn" data-a="pickme" data-pid="'+p.id+'">'+av(p,32)+'<span>'+esc(p.name)+'</span></button>').join('')+'</div></section>';
  return h+'<section class="card"><h2>מי מגיע</h2>'+rosterV(d)+'</section>';
}
const SAVED_HE={confirmed:'נרשמת, יש לך מקום',waitlist:'המקומות תפוסים, נרשמת לרשימת המתנה',no:'סומן שלא מגיע',none:''};
Object.assign(A,{
  showlogin(){ui.login=true;render();},
  async login(){
    const em=document.getElementById('lgE').value.trim(),pw=document.getElementById('lgP').value;
    if(!em||!pw){toast('הזן אימייל וסיסמה');return;}
    const r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){toast('פרטי כניסה שגויים');return;}
    SYNC.session=r.data.session;ui.login=false;
    if(!S.games.length&&!S.players.length)await pullAll();else await pushAll();
    render();loadEvent();
  },
  async logout(){await sb.auth.signOut();SYNC.session=null;EV.loaded=false;EV.ev=null;render();},
  async syncnow(){const ok=await pushAll();toast(ok?'סונכרן':'הסנכרון נכשל');render();},
  pullcloud(){ui.confirm='pull';render();},
  async pullyes(){ui.confirm=null;await pullAll();render();},
  rmphoto(el){pget(el.dataset.pid).photo=null;save();render();},
  cplink(el){copy(base()+'?p='+pget(el.dataset.pid).token,'הקישור הועתק');},
  async rotate(el){
    const id=el.dataset.pid;
    if(ui.confirm!=='rot'+id){ui.confirm='rot'+id;render();return;}
    ui.confirm=null;const t=randHex(24);
    const r=await sb.from('players').update({token:t}).eq('id',id);
    if(r.error){toast('צריך חיבור לענן');render();return;}
    pget(id).token=t;saveQuiet();render();toast('נוצר קישור חדש. הישן לא יעבוד יותר');
  },
  async mkevent(){
    const d=document.getElementById('evDate').value,c=Math.max(2,Math.floor(+document.getElementById('evCap').value||8));
    if(!d){toast('בחר תאריך');return;}
    const r=await sb.from('events').insert({event_date:d,capacity:c});
    if(r.error){toast('יצירת הערב נכשלה');return;}
    await loadEvent();render();
  },
  async evadd(){
    const id=document.getElementById('evAdd').value;if(!id)return;
    if(!(await pushAll())){toast('צריך חיבור לענן');return;}
    const r=await sb.from('rsvps').upsert({event_id:EV.ev.id,player_id:id,answer:'yes'},{onConflict:'event_id,player_id'});
    if(r.error){toast('ההוספה נכשלה');return;}
    await loadEvent();render();
  },
  async rmrsvp(el){await sb.from('rsvps').delete().eq('event_id',EV.ev.id).eq('player_id',el.dataset.pid);await loadEvent();render();},
  sent(el){S.sent=S.sent||{};S.sent[EV.ev.id+':'+el.dataset.k+':'+el.dataset.pid]=1;save();setTimeout(()=>{if(!editing())render();},500);},
  mute(){S.mute=!S.mute;save();render();if(!S.mute)baa(50);},
  tplreset(el){const k=el.dataset.k;S.tpl=S.tpl||{};delete S.tpl[k];save();render();toast('הוחזר הנוסח המקורי');},
  async capset(){
    const c=Math.max(2,Math.floor(+document.getElementById('evCap2').value||0));
    const r=await sb.from('events').update({capacity:c}).eq('id',EV.ev.id);
    if(r.error){toast('העדכון נכשל');return;}
    await loadEvent();render();toast('מספר המקומות עודכן');
  },
  cpinvite(){copy(inviteText(),'ההזמנה הועתקה');},
  fromevent(){
    const L=evLists(),d=newDraft();
    d.pids=L.confirmed.map(r=>r.player_id).filter(id=>S.players.some(p=>p.id===id));
    d.eventId=EV.ev.id;if(!d.pids.includes(d.banker))d.banker=null;
    ui.draft=d;go('new');
  },
  evcancel(){ui.confirm='evcancel';render();},
  async evcancelyes(){await sb.from('events').update({status:'cancelled'}).eq('id',EV.ev.id);ui.confirm=null;await loadEvent();render();},
  async prsvp(el){
    PUB.busy=true;
    try{const r=await sb.rpc('player_rsvp',{p_token:Q.get('p'),p_answer:el.dataset.v});if(r.error)throw r.error;toast(SAVED_HE[r.data.status]||'נשמר');}
    catch(e){toast('לא הצלחתי לשמור, נסה שוב');}
    PUB.busy=false;await pubLoad();
  },
  async irsvp(el){
    PUB.busy=true;
    try{const r=await sb.rpc('invite_rsvp',{p_invite:Q.get('i'),p_player:PUB.me,p_answer:el.dataset.v});if(r.error)throw r.error;toast(SAVED_HE[r.data.status]||'נשמר');}
    catch(e){toast('לא הצלחתי לשמור, נסה שוב');}
    PUB.busy=false;await pubLoad();
  },
  pickme(el){PUB.me=el.dataset.pid;try{localStorage.setItem('inv-me',PUB.me);}catch(e){}renderPub();},
  notme(){PUB.me=null;try{localStorage.removeItem('inv-me');}catch(e){}renderPub();}
});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el||el.tagName==='INPUT')return;
  const f=A[el.dataset.a];if(f)f(el);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.type==='file'&&el.dataset.photo){
    const f=el.files&&el.files[0];if(!f)return;
    shrink(f,u=>{if(!u){toast('לא הצלחתי לקרוא את התמונה');return;}pget(el.dataset.photo).photo=u;save();render();});
    return;
  }
  if(el.tagName==='INPUT'&&(el.type==='checkbox'||el.type==='radio')&&el.dataset.a){const f=A[el.dataset.a];if(f)f(el);return;}
  onInput(el,'change');
});
document.addEventListener('input',e=>onInput(e.target,'input'));
function onInput(el,ev){
  const k=el.dataset&&el.dataset.in;if(!k)return;
  const p=k.split(':'),t=p[0];
  if(t==='d'){ui.draft[p[1]]=el.value;}
  else if(t==='chip'){const c=ui.draft.chips[+p[1]];if(c)c[p[2]]=el.value;}
  else if(t==='amt'){ui.amt[p[1]]=el.value;}
  else if(t==='box'){ui.boxIn=el.value;}
  else if(t==='tpl'){S.tpl=S.tpl||{};S.tpl[p[1]||'invite']=el.value;save();}
  else if(t==='cc'||t==='cd'){
    const g=G();g.cashouts=g.cashouts||{};
    const c=g.cashouts[p[1]]||(g.cashouts[p[1]]={counts:{},direct:''});
    if(t==='cc')c.counts[p[2]]=el.value===''?'':Math.max(0,Math.floor(+el.value||0));else c.direct=el.value;
    if(ev==='change')logEv(g,'count',pname(p[1])+': ספירת סיום '+fmtMoney(cashoutOf(g,p[1])));
    save();
    const ct=document.getElementById('ct-'+p[1]);if(ct)ct.innerHTML=money(cashoutOf(g,p[1]));
    const ft=document.getElementById('foot');if(ft){const b=ft.querySelector('button');ft.innerHTML=footHtml(g);ft.appendChild(b);}
  }
  else if(t==='pl'){const pl=S.players.find(x=>x.id===p[1]);if(pl){pl[p[2]]=el.value;save();}}
}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
if(MODE==='admin'){render();initCloud();}else pubStart();
</script>
