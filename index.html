<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12151D">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: one narrow column, phone first. Pot figure leads, everything else is cards the host taps through during the night. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface2:#ECEEF4; --fg:#161A26; --muted:#5B6275; --line:#DADDE7;
  --accent:#3355D6; --accent-fg:#FFFFFF; --good:#17794B; --bad:#C23B2B; --warn:#8F5B00;
  --f-body:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --f-num:'Rubik','Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151D; --surface:#1B1F2C; --surface2:#262B3B; --fg:#ECEEF5; --muted:#9AA2B8; --line:#2E3447;
  --accent:#8199FF; --accent-fg:#0E1220; --good:#4CC38A; --bad:#FF8272; --warn:#E5B04A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151D; --surface:#1B1F2C; --surface2:#262B3B; --fg:#ECEEF5; --muted:#9AA2B8; --line:#2E3447;
  --accent:#8199FF; --accent-fg:#0E1220; --good:#4CC38A; --bad:#FF8272; --warn:#E5B04A; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);
  padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;text-align:right}
h1{font:700 22px/1.2 var(--f-num);margin:0}
h2{font:700 17px/1.3 var(--f-num);margin:0}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.top .sub{color:var(--muted);font-size:14px}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.02em}
.num{direction:ltr;unicode-bidi:isolate;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.active{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row>div{min-width:0}
.grow{flex:1}
.big{font:700 24px/1 var(--f-num)}
.potnum{font:700 44px/1.05 var(--f-num)}
.split{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.btn{font:500 16px var(--f-body);min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tag:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.lg{min-height:54px;font-size:18px;font-weight:700}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
.tab{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:500 15px var(--f-body);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.12)}
input,select{font:16px var(--f-body);min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0;width:100%}
input[type=color]{padding:2px;width:44px;flex:none}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 14px var(--f-body);padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);cursor:pointer;min-height:32px}
.tag:hover{border-color:var(--bad)}
.add{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg3 .btn,.seg2 .btn{padding:8px 4px}
.btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cc{display:grid;grid-template-columns:18px 1fr 64px;gap:6px;align-items:center;font-size:14px}
.cc i{width:18px;height:18px;border-radius:50%;border:2px dashed rgb(255 255 255/.55);outline:1px solid var(--line)}
.cc input{min-height:38px;padding:4px 6px}
.cc small{color:var(--muted)}
.direct{display:grid;grid-template-columns:auto 110px;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.foot{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:13px}
td.n,th.n{text-align:left}
.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .who{flex:1;min-width:120px}
.line.done{opacity:.55}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.pickrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.pickrow label{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.chiped{display:grid;grid-template-columns:44px 1fr 90px 44px;gap:6px;align-items:center}
.editp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.editp .full{grid-column:1/-1}
textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;width:100%;min-height:120px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px;direction:ltr}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90vw}
.back{align-self:flex-start}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s,background .15s}}
</style>
<div id="app" dir="rtl" lang="he"></div>
<script>
/*LOGIC*/
const r2=n=>Math.round((+n||0)*100)/100;
function gameTotals(g){
  const per={};
  for(const pid of g.pids)per[pid]={buy:0,cash:0,bit:0,credit:0,n:0};
  for(const e of g.entries){const p=per[e.pid];if(!p||e.void)continue;p.buy=r2(p.buy+e.amount);p[e.method]=r2(p[e.method]+e.amount);p.n++;}
  return per;
}
function chipValue(g,counts){return r2(g.chips.reduce((s,c)=>s+(+(counts&&counts[c.id])||0)*c.value,0));}
function cashoutOf(g,pid){
  const c=g.cashouts&&g.cashouts[pid];
  if(!c)return 0;
  if(c.direct!==''&&c.direct!=null&&!isNaN(+c.direct))return r2(c.direct);
  return chipValue(g,c.counts);
}
/* transfer>0: הבנקאי משלם לשחקן. transfer<0: השחקן משלם לבנקאי. חוב = ביי-אין שעדיין לא שולם. */
function settle(g){
  const per=gameTotals(g);
  const rows=g.pids.map(pid=>{
    const t=per[pid],out=cashoutOf(g,pid);
    return {pid,buy:t.buy,cash:t.cash,bit:t.bit,credit:t.credit,out,net:r2(out-t.buy),transfer:pid===g.banker?0:r2(out-t.credit)};
  });
  const pot=r2(rows.reduce((s,x)=>s+x.buy,0));
  const outTotal=r2(rows.reduce((s,x)=>s+x.out,0));
  return {rows,pot,outTotal,diff:r2(outTotal-pot)};
}
/* מה אמור להיות פיזית בקופה ובחשבון הביט. "עכשיו" לפי מה שסומן שולם, "בסוף" אחרי שכל השורות ישולמו. */
function boxStatus(g){
  let cash=0,bit=0;
  for(const e of g.entries){if(e.void)continue;if(e.method==='cash')cash+=e.amount;else if(e.method==='bit')bit+=e.amount;}
  const cashBuy=r2(cash);
  let cashEnd=cash,bitEnd=bit;
  for(const r of settle(g).rows){
    if(r.transfer===0)continue;
    const paid=!!(g.paid&&g.paid[r.pid]);
    if(r.transfer<0){
      const a=-r.transfer,m=(g.debtM&&g.debtM[r.pid])||'bit';
      if(m==='cash'){cashEnd+=a;if(paid)cash+=a;}else{bitEnd+=a;if(paid)bit+=a;}
    }else{
      const a=r.transfer,m=(g.payout&&g.payout[r.pid])||'cash';
      if(m==='cash'){cashEnd-=a;if(paid)cash-=a;}else{bitEnd-=a;if(paid)bit-=a;}
    }
  }
  return {cashBuy,cashNow:r2(cash),bitNow:r2(bit),cashEnd:r2(cashEnd),bitEnd:r2(bitEnd)};
}
function statsOf(games){
  const m={};
  for(const g of games.filter(g=>g.status==='done')){
    for(const r of settle(g).rows){
      const a=m[r.pid]||(m[r.pid]={pid:r.pid,games:0,buy:0,out:0,wins:0});
      a.games++;a.buy=r2(a.buy+r.buy);a.out=r2(a.out+r.out);if(r.net>0)a.wins++;
    }
  }
  return Object.values(m).map(a=>({...a,net:r2(a.out-a.buy)})).sort((x,y)=>y.net-x.net);
}
function phoneIntl(p){
  let d=String(p||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='972'+d.slice(1);
  return d;
}
const fmtMoney=n=>{n=r2(n);const a=Math.abs(n);const s=Number.isInteger(a)?String(a):a.toFixed(2);return '₪'+s.replace(/\B(?=(\d{3})+(?!\d))/g,',');};
function billText(g,row,name,bankerName,bankerPhone){
  const owe=-row.transfer;
  let t='היי '+name+', סיכום '+g.name+': ביי-אין '+fmtMoney(row.buy)+', סיום '+fmtMoney(row.out)+'. ';
  t+='נשאר לשלם '+fmtMoney(owe)+' בביט ל'+bankerName+(bankerPhone?' ('+bankerPhone+')':'')+'. תודה!';
  return t;
}
/*END*/

const KEY='kupa-hayya-v1';
const DEF_CHIPS=[
  {id:'c1',name:'לבן',color:'#E8E8EC',value:10},
  {id:'c2',name:'אדום',color:'#D64541',value:20},
  {id:'c3',name:'ירוק',color:'#2E9E62',value:50},
  {id:'c4',name:'שחור',color:'#2A2A31',value:100},
  {id:'c5',name:'כחול',color:'#3B5BDB',value:200}
];
const M_HE={cash:'מזומן',bit:'ביט',credit:'חוב'};
let storageOK=true;
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&Array.isArray(j.games)&&Array.isArray(j.players))return j;}catch(e){storageOK=false;}
  return {players:[],games:[],lastChips:null,lastBuyin:100};
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}}
const ui={view:'home',tab:'games',gameId:null,draft:null,amt:{},fb:null,confirm:null,toast:'',logOpen:false,boxIn:''};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=h=>'<bdi class="num">'+h+'</bdi>';
const money=n=>num(fmtMoney(n));
const signed=n=>num((n>0?'+':n<0?'−':'')+fmtMoney(n));
const cls=n=>n>0?'pos':n<0?'neg':'';
const pname=id=>{const p=S.players.find(p=>p.id===id);return p?p.name:'?';};
const pget=id=>S.players.find(p=>p.id===id)||{};
const G=()=>S.games.find(g=>g.id===ui.gameId);
const dateHe=t=>new Date(t).toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:'2-digit'});
const timeHe=t=>new Date(t).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
function logEv(g,type,text){(g.log=g.log||[]).push({id:uid(),t:Date.now(),type,text});}
function logV(g){
  const L=(g.log||[]).slice().reverse();
  return '<section class="card"><button class="btn" data-a="togglelog">'+(ui.logOpen?'הסתר':'הצג')+' יומן שינויים ('+L.length+')</button>'
   +(ui.logOpen?(L.length?L.map(x=>'<div class="line"><span class="muted small num">'+timeHe(x.t)+'</span><span class="who'+(x.type==='void'?' neg':'')+'">'+esc(x.text)+'</span></div>').join(''):'<span class="muted">אין רשומות.</span>')+'<span class="muted small">היומן רק נוסף. ביי-אין שנמחק מסומן כבוטל ולא נעלם.</span>':'')+'</section>';
}
function boxResult(c){
  if(!c)return '';
  const d=c.diff;
  return '<div class="row"><span class="pill '+(d===0?'good':'bad')+'">'+(d===0?'תואם ✓':'הפרש '+signed(d))+'</span><span class="muted small">בדיקה אחרונה '+timeHe(c.t)+': צפוי '+num(fmtMoney(c.expected))+', בפועל '+num(fmtMoney(c.actual))+'</span></div>';
}
function boxInput(){return '<div class="row"><input type="number" inputmode="decimal" min="0" data-in="box" placeholder="כמה מזומן יש בפועל (₪)" value="'+esc(ui.boxIn)+'" aria-label="מזומן בפועל בקופה"><button class="btn" data-a="boxcheck">בדוק</button></div>';}
function boxLiveV(g){
  const last=(g.boxChecks||[]).slice(-1)[0];
  return '<section class="card"><h2>בדיקת קופה</h2><div class="row"><span class="muted grow">מזומן שצריך להיות בקופה</span><b>'+money(boxStatus(g).cashBuy)+'</b></div>'+boxInput()+boxResult(last)+'</section>';
}
const $app=document.getElementById('app');

function toast(t){
  ui.toast=t;const old=document.querySelector('.toast');if(old)old.remove();
  const d=document.createElement('div');d.className='toast';d.textContent=t;d.setAttribute('role','status');document.body.appendChild(d);
  setTimeout(()=>d.remove(),2200);
}
function go(view,id){ui.view=view;if(id!==undefined)ui.gameId=id;ui.confirm=null;ui.fb=null;ui.boxIn='';render();window.scrollTo(0,0);}
function ensurePlayer(name){
  name=String(name||'').trim();if(!name)return null;
  let p=S.players.find(p=>p.name===name);
  if(!p){p={id:uid(),name,phone:'',method:'cash'};S.players.push(p);}
  return p;
}

/* ---------- views ---------- */
function topV(){return '<header class="top"><h1>קופה חיה</h1><span class="sub">משחק ביתי · קאש</span></header>'+(storageOK?'':'<div class="card"><span class="pill warn">שים לב</span><span class="small">הדפדפן הזה לא שומר נתונים. היסטוריה לא תישמר בין ביקורים.</span></div>');}

function homeV(){
  const active=S.games.find(g=>g.status!=='done');
  let h='';
  if(active){
    const s=settle(active);
    h+='<section class="card active"><div class="eyebrow">משחק פעיל</div><div class="row"><div class="grow"><b>'+esc(active.name)+'</b><div class="muted small">'+active.pids.length+' שחקנים · בנקאי: '+esc(pname(active.banker))+'</div></div><div class="big">'+money(s.pot)+'</div></div><button class="btn primary block" data-a="open" data-id="'+active.id+'">'+(active.status==='cash'?'המשך לספירת סיום':'חזרה למשחק')+'</button></section>';
  }else h+='<button class="btn primary block lg" data-a="newgame">משחק חדש</button>';
  h+='<div class="tabs" role="tablist">'+[['games','משחקים'],['players','שחקנים'],['backup','גיבוי']].map(t=>'<button class="tab" role="tab" aria-selected="'+(ui.tab===t[0])+'" data-a="tab" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  if(ui.tab==='games')h+=gamesTab();else if(ui.tab==='players')h+=playersTab();else h+=backupTab();
  return h;
}
function gamesTab(){
  const done=S.games.filter(g=>g.status==='done').sort((a,b)=>b.date-a.date);
  if(!done.length)return '<section class="card"><b>עדיין אין משחקים שמורים</b><span class="muted">אחרי המשחק הראשון תופיע כאן ההיסטוריה, ובלשונית שחקנים תראו כמה כל אחד הרוויח או הפסיד מאז תחילת המעקב.</span></section>';
  return done.map(g=>{
    const s=settle(g);
    return '<button class="card" style="text-align:right;cursor:pointer;font:inherit;color:inherit" data-a="open" data-id="'+g.id+'"><div class="row"><div class="grow"><b>'+esc(g.name)+'</b><div class="muted small">'+dateHe(g.date)+' · קופה '+money(s.pot)+'</div></div></div><div class="tags">'+s.rows.slice().sort((a,b)=>b.net-a.net).map(r=>'<span class="pill '+(r.net>0?'good':r.net<0?'bad':'')+'">'+esc(pname(r.pid))+' '+signed(r.net)+'</span>').join('')+'</div></button>';
  }).join('');
}
function playersTab(){
  const st=statsOf(S.games);
  let h='';
  if(st.length){
    h+='<section class="card"><h2>מאז תחילת המעקב</h2><div class="tblw"><table><thead><tr><th>שחקן</th><th class="n">משחקים</th><th class="n">ביי-אין</th><th class="n">סיום</th><th class="n">נטו</th></tr></thead><tbody>'+st.map(a=>'<tr><td>'+esc(pname(a.pid))+'<div class="muted small">ניצחונות '+a.wins+' מתוך '+a.games+'</div></td><td class="n">'+num(a.games)+'</td><td class="n">'+money(a.buy)+'</td><td class="n">'+money(a.out)+'</td><td class="n '+cls(a.net)+'"><b>'+signed(a.net)+'</b><div class="muted small">ממוצע '+signed(r2(a.net/a.games))+'</div></td></tr>').join('')+'</tbody></table></div></section>';
  }else h+='<section class="card"><span class="muted">הסטטיסטיקה תתחיל להצטבר אחרי המשחק הראשון ששמרתם.</span></section>';
  h+='<section class="card"><h2>ניהול שחקנים</h2><span class="muted small">טלפון נחוץ לשליחת הודעת תשלום בוואטסאפ. אמצעי תשלום מועדף קובע את ברירת המחדל כשהבנקאי משלם.</span>';
  if(!S.players.length)h+='<span class="muted">אין שחקנים עדיין. מוסיפים אותם בעת פתיחת משחק חדש או כאן.</span>';
  h+=S.players.map(p=>'<div class="editp" style="padding-top:8px;border-top:1px solid var(--line)"><label class="f full">שם<input value="'+esc(p.name)+'" data-in="pl:'+p.id+':name"></label><label class="f">טלפון<input type="tel" inputmode="tel" value="'+esc(p.phone)+'" data-in="pl:'+p.id+':phone" placeholder="050-0000000"></label><label class="f">מקבל תשלום ב<select data-in="pl:'+p.id+':method"><option value="cash"'+(p.method==='cash'?' selected':'')+'>מזומן</option><option value="bit"'+(p.method==='bit'?' selected':'')+'>ביט</option></select></label></div>').join('');
  h+='<div class="row" style="padding-top:8px"><input id="npTab" placeholder="שם שחקן חדש" aria-label="שם שחקן חדש"><button class="btn" data-a="addPlayerTab">הוסף</button></div></section>';
  return h;
}

  copybk(){copy(JSON.stringify(S),'הגיבוי הועתק');},
  restore(){
    try{const j=JSON.parse(document.getElementById('rs').value);
      if(!j||!Array.isArray(j.games)||!Array.isArray(j.players))throw 0;
      S=j;save();render();toast('הנתונים שוחזרו');
    }catch(e){toast('הגיבוי לא תקין');}
  },
  reset(){ui.confirm='reset';render();},
  resetyes(){S={players:[],games:[],lastChips:null,lastBuyin:100};save();ui.confirm=null;render();toast('הכל נמחק');}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el||el.tagName==='INPUT')return;
  const f=A[el.dataset.a];if(f)f(el);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.tagName==='INPUT'&&(el.type==='checkbox'||el.type==='radio')&&el.dataset.a){const f=A[el.dataset.a];if(f)f(el);return;}
  onInput(el,'change');
});
document.addEventListener('input',e=>onInput(e.target,'input'));
function onInput(el,ev){
  const k=el.dataset&&el.dataset.in;if(!k)return;
  const p=k.split(':'),t=p[0];
  if(t==='d'){ui.draft[p[1]]=el.value;}
  else if(t==='chip'){const c=ui.draft.chips[+p[1]];if(c)c[p[2]]=el.value;}
  else if(t==='amt'){ui.amt[p[1]]=el.value;}
  else if(t==='box'){ui.boxIn=el.value;}
  else if(t==='cc'||t==='cd'){
    const g=G();g.cashouts=g.cashouts||{};
    const c=g.cashouts[p[1]]||(g.cashouts[p[1]]={counts:{},direct:''});
    if(t==='cc')c.counts[p[2]]=el.value===''?'':Math.max(0,Math.floor(+el.value||0));else c.direct=el.value;
    if(ev==='change')logEv(g,'count',pname(p[1])+': ספירת סיום '+fmtMoney(cashoutOf(g,p[1])));
    save();
    const ct=document.getElementById('ct-'+p[1]);if(ct)ct.innerHTML=money(cashoutOf(g,p[1]));
    const ft=document.getElementById('foot');if(ft){const b=ft.querySelector('button');ft.innerHTML=footHtml(g);ft.appendChild(b);}
  }
  else if(t==='pl'){const pl=S.players.find(x=>x.id===p[1]);if(pl){pl[p[2]]=el.value;save();}}
}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
render();
</script>
